<div class="min-w-screen min-h-screen h-screen bg-linear-to-r from-(--bg-gradient-primary) to-(--bg-blue-lightess)">
    <main class="flex flex-col items-center w-full h-full
    lg:justify-center">

        @if (isSuccessLogin()) {
        <div
            class="fixed flex justify-center items-center top-0 left-0 bg-black/40 w-screen h-screen z-99 backdrop-blur-xs">
            <output class="relative flex items-center justify-start py-10 px-6 flex-col bg-(--white-default) w-[90%] aspect-video
            md:w-1/2 md:aspect-16/8
            lg:w-1/3
            2xl:w-1/4 2xl:aspect-16/8">
                <p class="text-xl text-center text-(--blue-primary) font-bold">Seja bem vindo(a) {{nameLogin()}}</p>
                <p class="flex flex-1 items-center text-center">Estamos redirecionando seu login para a página principal...</p>

                <div class="absolute bg-(--blue-primary) w-full animate-loading-bar h-2 bottom-0 left-0"></div>
            </output>
        </div>
        }

        <section class="flex items-center w-[calc(100%-14px)] h-full
        md:justify-center
        lg:w-[85%] lg:h-[90%] lg:shadow-lg lg:bg-(--bg-blue-lightess) lg:items-start lg:justify-start lg:rounded-lg
        xl:aspect-video xl:w-3/4 xl:h-4/5 xl:max-h-198 xl:max-w-8xl">
            <div class="relative flex flex-col bg-(--white-default) w-full h-8/9 min-h-132 max-h-174 rounded-lg px-6 pb-10 pt-16
            md:w-3/4 md:max-h-212 md:px-8 md:py-16
            lg:w-1/2 lg:h-full lg:py-8 lg:max-h-none lg:rounded-tr-none lg:rounded-br-none">
                <img src="images/banner-log.png" alt="Logo do site" class="absolute right-0 top-0 aspect-square w-18
                md:w-22 md:right-4 md:top-2">
                <header class="h-24">
                    <h2 class="text-2xl">Seja bem vindo(a)</h2>
                    <p class="text-(--text-color-gray)
                    xl:mt-2">Faça login para acessar sua conta:</p>
                </header>
                <form (ngSubmit)="onSubmit()" [formGroup]="profileForm" class="flex flex-col flex-1 justify-between">
                    <div class="flex flex-col items-end gap-8 w-full
                    md:mt-18 md:gap-12
                    xl:mt-8">
                        @for (input of inputsData; track input.id) {
                        <div class="w-full">
                            <app-input-login [controlName]="input.id" [id]="input.id" [label]="input.label"
                                [type]="input.type" [placeholder]="input.placeholder"
                                [errorMessage]="input.errorMessage" [invalidField]="statusLogin()"
                                [inputImg]="input.inputImg">
                            </app-input-login>
                        </div>
                        }
                        <a href="#" class="text-(--text-color-gray) underline
                        lg:-mt-8">Esqueci minha senha</a>
                    </div>
                    <div class="flex flex-1 justify-center items-center">
                        <p #messageError class="font-bold text-(--red-default)" [hidden]="isErroMessageHidden()"></p>
                        <div [hidden]="isLoadingHidden()" class="flex justify-center items-center gap-2 w-full">
                            <div
                                class="w-8 h-8 rounded-full animate-roll border-5 border-t-(--blue-light) border-r-(--blue-primary) border-l-(--blue-primary) border-b-(--blue-primary)">
                            </div>
                            <p class="text-(--blue-primary) font-bold text-lg">Autenticando...</p>
                        </div>
                    </div>
                    <div class="w-full h-12">
                        <app-confirm-button [buttonLabel]="'Login'">
                        </app-confirm-button>
                    </div>
                </form>
            </div>
            <div class="hidden lg:flex lg:items-center lg:justify-center lg:w-1/2 lg:h-full">
                <img class="lg:aspect-square lg:w-auto lg:h-2/3" src="images/Image_login.png" alt="">
            </div>
        </section>
    </main>
</div>
