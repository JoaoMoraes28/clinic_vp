<section class="fixed w-screen h-screen z-100 inset-0 flex flex-col items-center px-4 pt-12 overflow-x-auto pb-6 bg-(--bg-modal)
        md:px-12
        lg:relative lg:w-132 lg:h-auto lg:aspect-4/5 lg:py-8 lg:px-8
        2xl:w-162">
    <header class="flex">
        <h2 class="text-(--blue-primary) font-bold text-3xl">Consulta</h2>
        <button (click)="closeModalConsultation()" class="absolute right-4 top-4 md:right-10 md:top-6">
            <app-close iconColor="var(--blue-primary)" [width]="32" [height]="32">
            </app-close>
        </button>
    </header>
    <div class="flex-1 flex flex-col justify-center w-full py-4 gap-6 mt-6 md:py-0 lg:mt-12">
        <h3 class="text-(--blue-primary) font-bold">Dados do Paciente</h3>
        <div class="w-full">
            <app-data-label [labelData]="labelData[0]">
            </app-data-label>
        </div>
        <div class="flex flex-col gap-6 md:gap-0 md:flex-row md:justify-between">
            <div class="md:w-[47%]">
                <app-data-label [labelData]="labelData[1]">
                </app-data-label>
            </div>
            <div class="md:w-[47%]">
                <app-data-label [labelData]="labelData[2]">
                </app-data-label>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full gap-6 py-4 md:py-0">
        <h3 class="text-(--blue-primary) font-bold">Dados da Consulta</h3>
        <div class="flex flex-col gap-6 md:flex-row md:gap-0 md:justify-between">
            <div class="md:w-[47%]">
                <app-data-label [labelData]="labelData[3]">
                </app-data-label>
            </div>
            <div class="md:w-[47%]">
                <app-data-label [labelData]="labelData[4]">
                </app-data-label>
            </div>
        </div>
        <div class="flex flex-col gap-6 md:flex-row md:gap-0 md:justify-between">
            <div class="md:w-[47%]">
                <app-data-label [labelData]="labelData[5]">
                </app-data-label>
            </div>
            <div class="md:w-[47%]">
                <app-data-label [labelData]="labelData[6]">
                </app-data-label>
            </div>
        </div>
    </div>

    <div class="flex items-start w-full h-38 mt-4 md:h-28 md:mt-0 lg:items-center">
        <div class="flex flex-col-reverse justify-end gap-3 w-full h-full 
        md:flex-row md:justify-between
        lg:h-12 lg:justify-between lg:flex-row lg:gap-0">
            <div class="w-full h-12 md:w-[45%] lg:w-[47%]">
                <app-cancel-button [buttonLabel]="'Cancelar consulta'" [buttonType]="'button'">
                </app-cancel-button>
            </div>
            <div class="w-full h-12 md:w-[45%] lg:w-[47%]">
                <app-confirm-button [buttonLabel]="'Confirmar consulta'"></app-confirm-button>
            </div>
        </div>
    </div>
</section>
