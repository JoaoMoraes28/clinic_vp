<form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="fixed top-0 right-0 bg-(--bg-modal) z-99 flex flex-col justify-between items-center px-4 pt-8 pb-6 w-full h-full overflow-auto
    md:px-12
    lg:relative lg:aspect-28/32 lg:w-auto lg:h-[calc(100%-24px)] lg:mt-3 lg:pb-0
    2xl:h-[calc(100%-128px)] 2xl:mt-16">
    <header class="py-2">
        <h2 class="text-2xl text-(--blue-primary) font-bold">Agendamento</h2>
        <button type="button" (click)="closeModalScheduleConsultation()"
            class="absolute right-4 top-4 md:right-10 md:top-6">
            <app-close iconColor="var(--blue-primary)" [width]="32" [height]="32">
            </app-close>
        </button>
    </header>
    <div class="flex flex-col gap-6 w-full py-4 md:gap-8">
        <p class="text-lg text-(--blue-primary) font-bold">Dados do paciente</p>
        <div (click)="OpenCloseModalSelector(inputsDatas[0].id)" class="relative">
            <app-input (functionInput)="filterPatients($event)" [inputDatas]="inputsDatas[0]"></app-input>
            @if(inputsDatas[0].visibleList()) {
            <div class="absolute top-11 w-full h-40 z-80">
                <app-fieldset-list [getPatient]="getPatientPreview.bind(this)" [fieldForm]="'patient'"
                    [list]="filteredPatients()" [profileForm]="profileForm">
                </app-fieldset-list>
            </div>
            }
        </div>
        <div class="flex flex-col gap-6 md:justify-between md:flex-row">
            <div class="md:w-[47%]">
                <app-input [inputDatas]="inputsDatas[1]"></app-input>
            </div>
            <div class="md:w-[47%]">
                <app-input [inputDatas]="inputsDatas[2]"></app-input>
            </div>
        </div>
    </div>
    <div class="flex gap-6 flex-col w-full py-4 md:gap-8">
        <p class="text-lg text-(--blue-primary) font-bold">Dados da consulta</p>
        <div class="flex flex-col gap-6 md:gap-8 lg:justify-between lg:flex-row">
            <div (click)="OpenCloseModalSelector(inputsDatas[3].id)" class="relative lg:w-[47%]">
                <app-input (functionInput)="filterSpecialitys($event)" [inputDatas]="inputsDatas[3]"></app-input>
                @if(inputsDatas[3].visibleList()) {
                <div class="absolute top-11 w-full h-40 z-80">
                    <app-fieldset-list [fieldForm]="'speciality'" [list]="filteredSpeciality()"
                        [profileForm]="profileForm">
                    </app-fieldset-list>
                </div>
                }
            </div>
            <div (click)="OpenCloseModalSelector(inputsDatas[4].id)" class="relative lg:w-[47%]">
                <app-input (functionInput)="filterDoctors($event)" [inputDatas]="inputsDatas[4]"></app-input>
                @if (inputsDatas[4].visibleList()) {
                <div class="absolute top-11 w-full h-40 z-80">
                    <app-fieldset-list [fieldForm]="'doctor'" [list]="filteredDoctors()" [profileForm]="profileForm">
                    </app-fieldset-list>
                </div>
                }
            </div>
        </div>
        <div class="flex flex-col gap-6 md:flex-row md:justify-between">
            <div class="md:w-[47%]">
                <app-input [inputDatas]="inputsDatas[5]"></app-input>
            </div>
            <div class="md:w-[47%]">
                <app-input [inputDatas]="inputsDatas[6]"></app-input>
            </div>
        </div>
    </div>
    <div class="flex w-full h-38 py-4 lg:items-center">
        <div class="flex flex-col-reverse justify-center gap-3 w-full h-full
            md:flex-row md:justify-between
            lg:h-12 lg:justify-between lg:flex-row lg:gap-0">
            <div class="w-full h-12 md:w-[45%] lg:w-[47%]">
                <app-cancel-button [buttonLabel]="'Cancelar consulta'" [buttonType]="'button'">
                </app-cancel-button>
            </div>
            <div class="w-full h-12 md:w-[45%] lg:w-[47%]">
                <app-confirm-button [buttonLabel]="'Confirmar consulta'"></app-confirm-button>
            </div>
        </div>
    </div>
</form>
