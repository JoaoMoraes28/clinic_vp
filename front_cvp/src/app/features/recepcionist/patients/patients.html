<div class="w-full h-full">
    @if(isModalOpening()) {
    <section class="fixed bg-black/40 w-screen h-screen top-0 right-0 z-99
                lg:flex lg:justify-center">
        <app-patient-datas [patientDatas]="informationsLabel" (changeIsOpening)="changeModalOpening()">
        </app-patient-datas>
    </section>
    }
    <header class="fixed top-0 right-0 z-80 p-4 bg-(--bg-primary) h-50 w-full flex flex-col gap-4
            md:h-36 md:px-12 md:pt-6
            lg:static lg:px-0 lg:pt-6 lg:bg-transparent">
        <h1 class="text-2xl font-semibold">Pacientes cadastrados</h1>
        <div class="flex flex-col gap-4 
        md:flex-row
        2xl:justify-between">
            <div class="w-full h-12 md:w-2/3 md:h-11 lg:flex-1 2xl:w-196 2xl:flex-none">
                <app-input-search-patient (filter)="filterPatients($event)">
                </app-input-search-patient>
            </div>
            <div class="w-full h-13 md:w-1/3 md:h-11 lg:w-64">
                <app-add-patient-button></app-add-patient-button>
            </div>
        </div>
    </header>
    <section class="mt-48 md:mt-32 lg:mt-0 lg:h-[calc(100%-164px)] overflow-auto lg:">
        <ul class="grid gap-6 w-full
        md:grid-cols-2 place-items-center
        2xl:grid-cols-3">
            @for (patient of filteredPatients(); track patient.id) {
            <li class="w-full">
                <app-patient-card [patient]="patient" (changeIsOpening)="changeModalOpening()">
                </app-patient-card>
            </li>
            }
        </ul>
    </section>
</div>
