<div class="flex flex-col items-center min-w-full min-h-full lg:h-full lg:py-6">
    <header class="flex flex-col items-center w-full gap-4
    md:flex-row md:items-end lg:min-h-10">
        <h1 class="text-2xl font-semibold
        md:w-5xl">Consultas agendadas para hoje</h1>
        <div class="flex justify-end items-center gap-1 w-full">
            <app-calendary-icon [color]="'var(--blue-dark)'" [height]="22" [width]="22">
            </app-calendary-icon>
            <p class="font-bold text-(--blue-dark)">{{todayFormatted}}</p>
        </div>
    </header>
    <section class="flex flex-col flex-1 bg-(--bg-gray) w-full p-2 mt-2
    md:mt-8 md:p-6 lg:h-[calc(100%-72px)] lg:items-center">
        <header class="py-4 bg-(--white-default)
        lg:w-full">
            <ul class="grid grid-cols-2 grid-rows-2 gap-4 place-items-center
            md:flex md:justify-evenly 
            lg:h-12 lg:justify-around">
                @for (badge of badges; track badge.text) {
                <app-badges-consultation [badge]="badge">
                </app-badges-consultation>
                }
            </ul>
        </header>
        <section class="lg:flex lg:items-center lg:pt-4 lg:h-[calc(100%-148px)] lg:w-full lg:gap-6">
            <div (click)="rollCarousel('left')"
                class="hidden lg:flex lg:justify-center lg:items-center lg:pr-1 lg:bg-(--blue-dark)/50 lg:w-10 lg:h-10 lg:rounded-full">
                <app-arrow [rotate]="0" [width]="22" [height]="22" [color]="'var(--white-default)'">
                </app-arrow>
            </div>
            <ul #containerCarousel class="flex gap-4 w-full h-full mt-8 overflow-auto scroll-smooth snap-x snap-mandatory
            lg:flex-1 lg:w-full lg:gap-7">
                @for (consultations of consultationsData; track consultations.hour; let i = $index) {
                <li #consultation class="min-w-full snap-center 
                lg:snap-end
                xl:min-w-[48%] 2xl:min-w-[32%]">
                    <app-consultations-table #consultationTable [consultationsData]="consultations" [index]="i">
                    </app-consultations-table>
                </li>
                }
            </ul>
            <div (click)="rollCarousel('right')"
                class="hidden lg:flex lg:justify-center lg:items-center lg:pl-1 lg:bg-(--blue-dark)/50 lg:w-10 lg:h-10 lg:rounded-full">
                <app-arrow [rotate]="180" [width]="22" [height]="22" [color]="'var(--white-default)'">
                </app-arrow>
            </div>
        </section>
        <footer class="hidden lg:block lg:w-full lg:h-13 lg:mt-6">
            <ul class="lg:flex lg:w-full lg:h-full justify-center gap-3">
                @for(hour of consultationsData; track hour.hour; let i = $index ) {
                    <app-location-ball
                    [hourLabel]="getHourNumber(hour.hour)" [index]="i" (scrollTo)="rollCarouselByLocationBall(i)">
                    </app-location-ball>
                }
            </ul>
        </footer>
    </section>
</div>
