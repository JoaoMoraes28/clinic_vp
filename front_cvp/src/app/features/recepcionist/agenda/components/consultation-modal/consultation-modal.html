<section class="fixed w-screen h-screen z-100 inset-0 flex flex-col items-center px-8 pt-12 bg-(--bg-modal)
        lg:relative lg:w-132 lg:h-auto lg:aspect-4/5 lg:py-8
        2xl:w-162">
    <header class="flex">
        <h2 class="text-(--blue-primary) font-bold text-3xl">Consulta</h2>
        <button (click)="closeModalConsultation()" class="absolute right-4 top-4">
            <app-close iconColor="var(--blue-primary)" [width]="32" [height]="32">
            </app-close>
        </button>
    </header>
    <div class="flex-1 flex flex-col justify-center w-full gap-6 mt-6 lg:mt-12">
        <h3 class="text-(--blue-primary) font-bold">Dados do Paciente</h3>
        <div class="w-full">
            <app-data-label [labelData]="labelData[0]">
            </app-data-label>
        </div>
        <div class="flex justify-between">
            <div class="w-[47%]">
                <app-data-label [labelData]="labelData[1]">
                </app-data-label>
            </div>
            <div class="w-[47%]">
                <app-data-label [labelData]="labelData[2]">
                </app-data-label>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full gap-6">
        <h3 class="text-(--blue-primary) font-bold">Dados da Consulta</h3>
        <div class="flex justify-between">
            <div class="w-[47%]">
                <app-data-label [labelData]="labelData[3]">
                </app-data-label>
            </div>
            <div class="w-[47%]">
                <app-data-label [labelData]="labelData[4]">
                </app-data-label>
            </div>
        </div>
        <div class="flex justify-between">
            <div class="w-[47%]">
                <app-data-label [labelData]="labelData[5]">
                </app-data-label>
            </div>
            <div class="w-[47%]">
                <app-data-label [labelData]="labelData[6]">
                </app-data-label>
            </div>
        </div>
    </div>

    <div class="flex items-start w-full h-32 lg:items-center">
        <div class="flex flex-col-reverse justify-end gap-3 w-full h-full lg:h-12 lg:justify-between lg:gap-0">
            <div class="w-full h-12 lg:w-[47%]">
                <app-cancel-button [buttonLabel]="'Cancelar consulta'" [buttonType]="'button'">
                </app-cancel-button>
            </div>
            <div class="w-full h-12 lg:w-[47%]">
                <app-confirm-button [buttonLabel]="'Confirmar consulta'"></app-confirm-button>
            </div>
        </div>
    </div>
</section>
