<div class="relative flex items-center pt-1 px-2 w-full h-12 border border-(--blue-primary) rounded-md">
    <label class="absolute left-2 -top-3 w-auto h-6 px-2 bg-(--bg-primary) text-sm text-(--blue-primary)"
        [for]="inputDatas().id">{{inputDatas().label}} @if(inputDatas().mandatory) {<span class="text-(--red-default)">*</span>}</label>
    <div class="flex w-full">
        <input [readonly]="inputDatas().readonly" (input)="changeInputValue($event.target.value)" formControlName="{{inputDatas().id}}" class="flex-1 text-(--black-default) text-nowrap overflow-auto text-sm" [id]="inputDatas().id"
            [type]="inputDatas().type" [placeholder]="inputDatas().placeholder">
        @if(inputDatas().showArrow) {
        <div class="w-6 flex justify-center items-center">
            <app-arrow [color]="'var(--blue-primary)'" [width]="18" [height]="18" [rotate]="270">
            </app-arrow>
        </div>
        }
    </div>
</div>
