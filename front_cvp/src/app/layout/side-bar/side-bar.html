<aside class="hidden lg:fixed lg:flex lg:flex-col lg:items-center lg:h-screen lg:w-58 lg:bg-(--blue-dark)
        xl:w-72">
    <header class="lg:w-full lg:h-22 p-2">
        <div
            class="lg:flex lg:justify-center lg:items-center lg:pr-0.5 lg:rounded-full lg:bg-(--white-default)/70 lg:h-16 lg:w-16">
            <img class="lg:w-auto lg:h-12" src="images/banner-log-without-name.png" alt="Logo da Clínica">
        </div>
    </header>
    <nav class="lg:w-full lg:flex-1">
        <ul class="lg:flex lg:flex-col lg:justify-center lg:w-full lg:pl-2 lg:pb-18 lg:gap-4 lg:h-full">
            @for (navBarIcon of navBarIcons; track navBarIcon.label) {
            <li>
                <app-nav-bar-icon (changeIconSelected)="setIconClick(navBarIcon.label)" [iconNavBar]="navBarIcon">
                </app-nav-bar-icon>
            </li>
            }
        </ul>
    </nav>
    <footer class="lg:flex lg:items-center lg:gap-4 lg:border-t-2 lg:w-[95%] lg:border-(--white-default) lg:h-22">
        <div
            class="lg:flex lg:justify-center lg:items-center lg:rounded-full lg:w-9 lg:h-9 lg:border-2 lg:border-(--white-default)">
            <app-profile-person [colorIcon]="'var(--white-default)'" [height]="20" [width]="20">
            </app-profile-person>
        </div>
        <span class="lg:text-lg lg:text-(--white-default)">Fabrício Silva</span>
    </footer>
</aside>
